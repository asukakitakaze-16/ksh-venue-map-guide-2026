<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会場MAP パンフレットデザイン案</title>
  <link rel="stylesheet" href="./map-design.css">
</head>
<body>
  <main class="brochure-preview">
    <header class="brochure-preview__header">
      <div>
        <span>DESIGN PREVIEW</span>
        <h1>会場MAP｜パンフレットデザイン案</h1>
      </div>
      <p>図面情報を来場者向けに整理した、掲載イメージです。</p>
    </header>

    <figure class="brochure-preview__map">
      <a href="./assets/venue-map-brochure-v2.png" target="_blank" rel="noopener" aria-label="パンフレットMAPを原寸で開く">
        <img src="./assets/venue-map-brochure-v2.png" alt="色分けされたブース島、A〜L、Aステージ・Bステージ、特別企画、メイン入口を掲載したパンフレット風会場MAP" width="1536" height="1024">
      </a>
      <figcaption>クリックすると画像を原寸で確認できます</figcaption>
    </figure>

    <aside class="brochure-preview__note">
      <b>デザイン確認用</b>
      <span>正式掲載時は、最終小間図に合わせて各ブロックの位置・形・小間情報を確定します。</span>
    </aside>
  </main>
</body>
</html>
